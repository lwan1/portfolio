<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" fill="none">
  <!-- Original 404 boss: an empty gallery frame with a broken link chain. -->
  <rect x="48" y="28" width="144" height="132" fill="#111" stroke="#f2f2f2" stroke-width="6"/>
  <rect x="58" y="38" width="124" height="112" fill="#0a0a0a" stroke="#9c5451" stroke-width="2"/>
  <text x="120" y="108" text-anchor="middle" fill="#9c5451" font-family="monospace" font-size="36" font-weight="700" letter-spacing="4">404</text>
  <circle cx="92" cy="72" r="4" fill="#ffffaa"/>
  <circle cx="148" cy="72" r="4" fill="#ffffaa"/>
  <!-- Broken chain -->
  <rect x="18" y="86" width="22" height="10" rx="4" stroke="#c9a87c" stroke-width="2" fill="none"/>
  <rect x="28" y="98" width="22" height="10" rx="4" stroke="#c9a87c" stroke-width="2" fill="none" transform="rotate(-28 39 103)"/>
  <rect x="200" y="86" width="22" height="10" rx="4" stroke="#c9a87c" stroke-width="2" fill="none"/>
  <line x1="40" y1="108" x2="48" y2="108" stroke="#c9a87c" stroke-width="2"/>
  <line x1="192" y1="108" x2="200" y2="108" stroke="#c9a87c" stroke-width="2"/>
  <!-- Pedestal -->
  <rect x="96" y="160" width="48" height="8" fill="#f2f2f2"/>
  <rect x="88" y="168" width="64" height="10" fill="#888"/>
</svg>
